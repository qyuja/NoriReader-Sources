name: Check Nori documentation and examples

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r scripts/source_protocol/requirements.txt
      - name: Check documentation and JSON examples
        run: python scripts/check_sources.py
      - name: Exercise the documented authoring flow
        run: |
          python scripts/pack_source.py init artifacts/example --id org.example.check --name 示例源
          python scripts/pack_source.py pack artifacts/example -o artifacts/example.nori.json
          python scripts/pack_source.py validate artifacts/example.nori.json
      - name: Check whitespace
        run: git diff --check
